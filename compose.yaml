services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: checkstock
      POSTGRES_USER: checkstock
      POSTGRES_PASSWORD: checkstock
    volumes:
      - stock_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "checkstock", "-d", "checkstock"]
      interval: 2s
      timeout: 3s
      retries: 20
  web:
    build: .
    environment:
      DATABASE_URL: postgresql://checkstock:checkstock@db/checkstock
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
volumes:
  stock_data:
